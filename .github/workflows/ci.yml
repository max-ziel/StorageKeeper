name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0

    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: 25
        cache: 'gradle'

    - name: Validate Gradle Wrapper
      uses: gradle/actions/wrapper-validation@v4

    - name: Run Tests
      run: ./gradlew test jacocoTestReport

    - name: Create coverage-data directory and copy contents
      run: |
        mkdir -p .qodana/code-coverage
        cp build/reports/jacoco/test/jacocoTestReport.xml .qodana/code-coverage/

    - name: Archive coverage data
      uses: actions/upload-artifact@v7
      with:
        name: gradle-coverage-data.zip
        path: .qodana/code-coverage

  image:
    # Only for main: every merged change becomes an image in the GitHub Container Registry.
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: 'gradle'

      - name: Build and publish image
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew bootBuildImage --publishImage -PimageTag=${GITHUB_SHA::7}
