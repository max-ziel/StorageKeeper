services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: storagekeeper
      POSTGRES_USER: storagekeeper
      POSTGRES_PASSWORD: storagekeeper
    ports:
      - "5432"
# Issues the JWTs for local development (realm "storagekeeper" with the test users alice and bob).
# Fixed port, because the issuer URL in the tokens must match storagekeeper's issuer-uri.
  keycloak:
    image: keycloak/keycloak:26.4
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./dev/keycloak:/opt/keycloak/data/import:ro
    ports:
        - "8180:8080"