spring:
  application:
    name: storagekeeper
  mvc:
    problemdetails:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health,info

storagekeeper:
  # Time zone that decides when a day starts, e.g., for "expires today".
  time-zone: Europe/Berlin