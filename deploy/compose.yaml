# Runs StorageKeeper with everything it needs: docker compose --env-file .env up -d (in this directory).
# Only the API (8080) and Keycloak (8180) are published. The actuator port 8081 stays inside the compose network.
name: storagekeeper

services:
  app:
    image: ghcr.io/max-ziel/storagekeeper:${STORAGEKEEPER_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/storagekeeper
      SPRING_DATASOURCE_USERNAME: storagekeeper
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Tokens carry the public Keycloak URL as issuer; the keys are fetched inside the network.
      STORAGEKEEPER_ISSUER_URI: ${KEYCLOAK_URL:-http://localhost:8180}/realms/storagekeeper
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/storagekeeper/protocol/openid-connect/certs
      STORAGEKEEPER_LOG_FORMAT: ecs
    ports:
      - "8080:8080"

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: storagekeeper
      POSTGRES_USER: storagekeeper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
      # Runs only on the first start with an empty volume: creates the database for Keycloak.
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storagekeeper -d storagekeeper"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: keycloak/keycloak:26.4
    restart: unless-stopped
    command: start --import-realm
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: storagekeeper
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # The URL clients use; it becomes the "iss" claim of every token.
      KC_HOSTNAME: ${KEYCLOAK_URL:-http://localhost:8180}
      # Plain HTTP is fine on localhost; behind a reverse proxy with HTTPS set KC_PROXY_HEADERS instead.
      KC_HTTP_ENABLED: "true"
    volumes:
      - ../dev/keycloak:/opt/keycloak/data/import:ro
    ports:
      - "8180:8080"

  # Optional: docker compose --env-file .env --profile monitoring up -d
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    profiles: [monitoring]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      # Only on this machine: Prometheus has no login.
      - "127.0.0.1:9090:9090"

volumes:
  postgres-data:
  prometheus-data: